<VirtualHost *:80>
    ServerName papem.marinha.local
    DocumentRoot /var/www/papem-laravel/public

    # PHP-FPM via socket (rotas normais)
    <FilesMatch "\.php$">
        SetHandler "proxy:unix:/run/php/php8.2-fpm-papem.sock|fcgi://localhost"
    </FilesMatch>

    # SSE: flushpackets=on faz o Apache enviar os dados ao cliente sem fazer buffering.
    # O X-Accel-Buffering só funciona no Nginx; para Apache com mod_proxy_fcgi
    # a forma correta é flushpackets=on na URL do handler.
    <LocationMatch "^/api/documents/stream$">
        SetHandler "proxy:unix:/run/php/php8.2-fpm-papem.sock|fcgi://localhost?flushpackets=on"
    </LocationMatch>

    <Directory "/var/www/html/papem-laravel/public">
        Options -Indexes
        AllowOverride All
        Require all granted
    </Directory>

    # Limite de upload (100 MB)
    LimitRequestBody 104857600

    # SSE: manter conexão aberta por até 1 hora
    ProxyTimeout 3600

    # Segurança: ocultar versão do servidor
    ServerTokens Prod

    ErrorLog /var/log/httpd/papem-error.log
    CustomLog /var/log/httpd/papem-access.log combined
</VirtualHost>
