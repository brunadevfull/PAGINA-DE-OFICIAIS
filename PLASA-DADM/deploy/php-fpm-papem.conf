; Pool PHP-FPM dedicado ao PAPEM
[papem]
user = www-data
group = www-data

listen = /run/php/php8.2-fpm-papem.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

; SSE: nunca matar conexões longas (streams ficam abertos horas)
request_terminate_timeout = 0

; Dimensionamento conservador para ambiente de TV/display
pm = dynamic
pm.max_children = 30
pm.start_servers = 5
pm.min_spare_servers = 3
pm.max_spare_servers = 10

; Logs
slowlog = /var/log/php8.2-fpm-slow.log
request_slowlog_timeout = 30s
