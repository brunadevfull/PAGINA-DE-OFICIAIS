; Pool PHP-FPM dedicado ao PAPEM — Oracle Linux 8/9
[papem]
user = apache
group = apache

listen = /run/php-fpm/papem.sock
listen.owner = apache
listen.group = apache
listen.mode = 0660

; SSE: encerra processo após 1 hora (evita acúmulo de processos zumbis)
request_terminate_timeout = 3600

; Dimensionamento conservador para ambiente de TV/display
pm = dynamic
pm.max_children = 30
pm.start_servers = 5
pm.min_spare_servers = 3
pm.max_spare_servers = 10

; Logs
slowlog = /var/log/php-fpm/papem-slow.log
request_slowlog_timeout = 30s
