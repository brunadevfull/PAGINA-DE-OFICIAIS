<VirtualHost *:80>
    ServerName papem.marinha.local
    DocumentRoot /var/ww/html/papem-laravel/public

    # PHP-FPM via socket (Oracle Linux: socket em /run/php-fpm/, user apache)
    <FilesMatch "\.php$">
        SetHandler "proxy:unix:/run/php-fpm/papem.sock|fcgi://localhost"
    </FilesMatch>

    <Directory "/var/www/html/papem-laravel/public">
        Options -Indexes
        AllowOverride All
        Require all granted
    </Directory>

    # SSE: não usar proxy buffering nas rotas de stream
    ProxyPass /api/documents/stream !
    ProxyPass /api/duty-officers/stream !

    # Limite de upload (100 MB)
    LimitRequestBody 104857600

    # SSE: manter conexão aberta por até 1 hora
    ProxyTimeout 3600
    Header always set X-Accel-Buffering "no"

    # Segurança: ocultar versão do servidor
    ServerTokens Prod

    ErrorLog /var/log/httpd/papem-error.log
    CustomLog /var/log/httpd/papem-access.log combined
</VirtualHost>
