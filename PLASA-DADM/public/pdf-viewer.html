<!DOCTYPE html>
<html>
<head>
  <title>PDF Viewer</title>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }
    #pdf-container {
      width: 100%;
      height: 100%;
      overflow: auto;
    }
    #pdf-object {
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>
  <div id="pdf-container">
    <object id="pdf-object" type="application/pdf" data="">
      Seu navegador não suporta visualização de PDF.
    </object>
  </div>

  <script>
    const ALLOWED_ORIGIN = window.location.origin;
    let scrollInterval;
    let currentPage = 1;

    window.addEventListener('message', function(event) {
      if (event.origin !== ALLOWED_ORIGIN) return;

      const data = event.data;

      if (data.type === 'loadPdf') {
        document.getElementById('pdf-object').data = data.url + '#page=' + data.page;
        currentPage = data.page;

        setTimeout(() => {
          event.source.postMessage({
            type: 'pdfLoaded',
            page: currentPage
          }, ALLOWED_ORIGIN);
        }, 1000);
      }

      if (data.type === 'startScroll') {
        clearInterval(scrollInterval);

        const container = document.getElementById('pdf-container');
        container.scrollTop = 0;

        let progress = 0;
        const duration = data.duration || 30000;
        const interval = 100;
        const step = 100 / (duration / interval);

        scrollInterval = setInterval(() => {
          progress += step;

          const maxScroll = container.scrollHeight - container.clientHeight;
          container.scrollTop = (progress / 100) * maxScroll;

          event.source.postMessage({
            type: 'scrollProgress',
            progress: Math.min(progress, 100),
            page: currentPage
          }, ALLOWED_ORIGIN);

          if (progress >= 100) {
            clearInterval(scrollInterval);
            event.source.postMessage({
              type: 'scrollComplete',
              page: currentPage
            }, ALLOWED_ORIGIN);
          }
        }, interval);
      }

      if (data.type === 'stopScroll') {
        clearInterval(scrollInterval);
      }
    });

    window.onload = function() {
      window.parent.postMessage({ type: 'viewerReady' }, ALLOWED_ORIGIN);
    };
  </script>
</body>
</html>
